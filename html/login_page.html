<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MediNexus | Portal Login</title>
    <link rel="icon" type="image/svg+xml" href="../assets/favicon.svg">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/login.css">
</head>
<body>
    <div class="main">
        <div class="container clay-card" style="max-width: 460px; padding: 28px 24px; border-radius: 16px; margin: auto;">
            <div style="text-align: center; margin-bottom: 20px;">
                <div class="logo" style="margin: 0 auto 12px auto; width: 50px; height: 50px;">
                    <img src="../assets/img/doc_half.png" alt="MediNexus Logo">
                </div>
                <h2 style="margin: 0; color: #174b57; font-size: 1.5rem; font-weight: 800;">MediNexus Portal</h2>
                <p style="margin: 4px 0 0 0; color: #5d757d; font-size: 0.85rem;">Access patient, donor, and clinic records</p>
            </div> 

            <form id="Form" action="" method="post" onsubmit="event.preventDefault(); alert('Login successful! Redirecting to dashboard...'); window.location.href='../index.html';">
                <center>
                    <select class="clay-card" style="width: 100%; height: 46px; border: 1px solid #d6deea; border-radius: 8px; padding: 0 12px; font-size: 0.95rem; color: #174b57;" required>
                        <option value="patient">Patient / Public User</option>
                        <option value="blood_donor">Blood Donor / Requester</option>
                        <option value="organ_donor">Organ Donor / Recipient</option>
                        <option value="doctor">Consultant Doctor / Staff</option>
                    </select>

                    <input class="clay-card" type="text" name="username" placeholder="Username / Donor ID / Mobile" required>
                    <input class="clay-card" type="password" name="password" placeholder="Password" required>
                    
                    <p style="font-size: 0.88rem; color: #52606d;">Don't have an account? <a href="sign_up.html" style="color: #174b57; font-weight: 700;">Sign up</a></p>
                    <button class="button-40" role="button" type="submit">Sign In to Portal</button>
                    <a href="../index.html" style="font-size: 0.85rem; color: #24636a; text-decoration: none; margin-top: 6px;">&larr; Back to Home</a>
                </center>
            </form>
        </div>
    </div>
</body>
</html>
