<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>sign_up</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/login.css">
    
</head>
<body>
    <div class="main">
        <div class="container clay-card">
           <div class="login_card">
                <p>SIGN UP</p>
           </div> 
           <form id="Form" action="" method="post">
               <center>
                   <input class="clay-card" type="text" name="username" placeholder="Username" required>
                   <input class="clay-card" type="email" name="email" placeholder="Email" required>
                   <input class="clay-card" type="password" name="password" placeholder="Password" required><br>
                    <p>already have an account? <a href="login_page.html">login</a></p>
                   <button class="button-40" role="button" type="submit">Sign Up</button>
               </center>
           </form>

        </div>
    </div>
</body>
</html>
