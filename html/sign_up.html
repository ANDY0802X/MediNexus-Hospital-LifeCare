<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MediNexus | Create Account</title>
    <link rel="icon" type="image/svg+xml" href="../assets/favicon.svg">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/login.css">
</head>
<body>
    <div class="main">
        <div class="container clay-card" style="max-width: 480px; padding: 28px 24px; border-radius: 16px; margin: auto;">
            <div style="text-align: center; margin-bottom: 20px;">
                <div class="logo" style="margin: 0 auto 12px auto; width: 50px; height: 50px;">
                    <img src="../assets/img/doc_half.png" alt="MediNexus Logo">
                </div>
                <h2 style="margin: 0; color: #174b57; font-size: 1.5rem; font-weight: 800;">Register with MediNexus</h2>
                <p style="margin: 4px 0 0 0; color: #5d757d; font-size: 0.85rem;">Join as a Patient, Blood Donor, or Organ Donor</p>
            </div> 

            <form id="Form" action="" method="post" onsubmit="event.preventDefault(); alert('Account registered successfully! Welcome to MediNexus.'); window.location.href='login_page.html';">
                <center>
                    <select class="clay-card" style="width: 100%; height: 46px; border: 1px solid #d6deea; border-radius: 8px; padding: 0 12px; font-size: 0.95rem; color: #174b57;" required>
                        <option value="patient">Patient Registration</option>
                        <option value="blood_donor">Blood Donor Registration</option>
                        <option value="organ_donor">Organ Donor Registration</option>
                    </select>

                    <input class="clay-card" type="text" name="fullname" placeholder="Full Name" required>
                    <input class="clay-card" type="email" name="email" placeholder="Email Address" required>
                    <input class="clay-card" type="tel" name="phone" placeholder="Mobile Number" required>
                    <input class="clay-card" type="password" name="password" placeholder="Create Password" required>
                    
                    <p style="font-size: 0.88rem; color: #52606d;">Already have an account? <a href="login_page.html" style="color: #174b57; font-weight: 700;">Login</a></p>
                    <button class="button-40" role="button" type="submit">Create Account</button>
                    <a href="../index.html" style="font-size: 0.85rem; color: #24636a; text-decoration: none; margin-top: 6px;">&larr; Back to Home</a>
                </center>
            </form>
        </div>
    </div>
</body>
</html>
